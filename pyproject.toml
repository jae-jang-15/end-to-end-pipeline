[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orders-pipeline"
version = "0.1.0"
description = "Lambda-based bronze/silver processing for the orders medallion pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=16",
]

[project.optional-dependencies]
dev = [
  "boto3>=1.34",     # provided by the Lambda runtime; needed locally
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "pre-commit>=3.7",
]
dbt = [
  "dbt-core>=1.8",
  "dbt-snowflake>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires live AWS/Snowflake resources"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dbt/target", "dbt/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["S101"]  # assert is fine in tests
