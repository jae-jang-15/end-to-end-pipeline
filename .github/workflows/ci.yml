name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write   # OIDC token for the read-only plan role

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit hooks (incl. private-key detection)
    # Re-runs every local hook in CI, so the checks hold even when a
    # contributor never installed the hooks on their machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3   # needed by the terraform_fmt hook
        with:
          terraform_version: "~1.10"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  python:
    name: Lint and test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: pytest
        run: |
          set +e
          pytest
          code=$?
          # exit code 5 = no tests collected yet (scaffold stage)
          if [ $code -eq 5 ]; then echo "No tests collected yet"; exit 0; fi
          exit $code

  terraform:
    name: Terraform fmt, validate, plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/live
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"
      - name: fmt
        working-directory: infra
        run: terraform fmt -check -recursive
      - name: Skip until Terraform exists
        id: has_tf
        run: |
          if ls *.tf >/dev/null 2>&1; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Configure AWS (OIDC, plan role)
        if: steps.has_tf.outputs.present == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: init + validate + plan
        if: steps.has_tf.outputs.present == 'true'
        env:
          SNOWFLAKE_ORGANIZATION_NAME: ${{ secrets.SNOWFLAKE_ORGANIZATION_NAME }}
          SNOWFLAKE_ACCOUNT_NAME: ${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
        run: |
          terraform init -input=false
          terraform validate
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt
          { echo '### Terraform plan'; echo '```'; tail -n 60 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
